{% extends "base.html" %}
{% block title %}Order Confirmed — GameHub{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="panel mx-auto" style="max-width:560px;">
        <i class="bi bi-check-circle-fill text-accent" style="font-size:3.5rem;"></i>
        <h2 class="mt-3">Order Confirmed!</h2>
        <p class="text-secondary">Thank you, {{ order.full_name }}. Your order <strong>#{{ order.id }}</strong> has been placed successfully.</p>
        <p class="fs-4 fw-bold mt-3">${{ order.total_amount }}</p>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{% url 'store:order_detail' order.id %}" class="btn btn-accent">View Order</a>
            <a href="{% url 'store:product_list' %}" class="btn btn-outline-accent">Continue Shopping</a>
        </div>
    </div>
</div>
{% endblock %}
