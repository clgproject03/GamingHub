{% extends "base.html" %}
{% block title %}Login — GameHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="panel mx-auto" style="max-width:440px;">
        <h3 class="mb-4 text-center"><i class="bi bi-controller"></i> Welcome Back</h3>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small text-secondary">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-accent w-100">Log In</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0">New to GameHub? <a href="{% url 'store:signup' %}" class="accent">Create an account</a></p>
    </div>
</div>
{% endblock %}
